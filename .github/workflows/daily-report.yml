name: Daily financial reports

on:
  schedule:
    # 06:30 UTC every weekday (before the US open).
    - cron: "30 6 * * 1-5"
  workflow_dispatch:
    inputs:
      tickers:
        description: "Comma-separated tickers"
        required: false
        default: "AAPL,MSFT,NVDA"

env:
  FORCE_DEMO_DATA: "0"
  ALLOW_DEMO_DATA: "1"
  LOG_LEVEL: "INFO"

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate reports
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          TICKERS="${{ github.event.inputs.tickers || 'AAPL,MSFT,NVDA' }}"
          python scripts/daily_report.py \
            --tickers "$TICKERS" \
            --days 90 \
            $( [ -z "$GOOGLE_API_KEY" ] && echo "--no-llm" ) \
            $( [ -n "$TELEGRAM_BOT_TOKEN" ] && echo "--telegram" )

      - name: Upload PDF reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-reports-${{ github.run_number }}
          path: |
            reports/output/pdfs/*.pdf
            reports/output/*.md
            reports/output/daily_summary.json
          if-no-files-found: warn
          retention-days: 30
