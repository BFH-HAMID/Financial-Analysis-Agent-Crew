[theme]
base = "light"
primaryColor = "#0B3D91"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F4F6FA"
textColor = "#1F2937"
font = "sans serif"

[server]
# Bind to all interfaces so the app also works inside Docker / hosted previews.
address = "0.0.0.0"
port = 8501
headless = true
# Proxied deployments (Docker, Cloud, hosted previews) terminate TLS at the edge,
# so cross-origin WebSocket checks must stay relaxed or the app cannot connect.
enableCORS = false
enableXsrfProtection = true
fileWatcherType = "auto"
maxUploadSize = 20

[browser]
gatherUsageStats = false

[client]
showSidebarNavigation = false
toolbarMode = "minimal"
